name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3"
          python -m pip install ".[data]"
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Exercise real ConvLSTM training and scan
        if: matrix.python-version == '3.14'
        env:
          OPHANIM_RUN_SPATIAL_TRAIN_SMOKE: "1"
        run: python -m unittest discover -s tests -p test_spatial_backend_smoke.py -v
      - name: Build distributions
        run: python -m pip install build twine && python -m build && python -m twine check dist/*

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose deployment
        run: docker compose config --quiet
